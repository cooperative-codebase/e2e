name: E2E Nightly (Playwright)

# Public GitHub Actions runner for the se-frontend Playwright smoke suite.
# Failure artifacts are copied to May First, never uploaded as GitHub artifacts.

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      run_kind:
        description: Why this run was requested.
        required: false
        default: manual
        type: choice
        options:
          - manual
          - merge
          - pr
          - notification-soak
      source_repository:
        description: Forgejo repository that requested a merge run.
        required: false
        type: string
      source_sha:
        description: Commit SHA that requested a merge run.
        required: false
        type: string
      frontend_branch:
        description: se-frontend branch (empty = selected E2E branch, then main fallback).
        required: false
        type: string
      backend_branch:
        description: se-backend branch (empty = selected E2E branch, then main fallback).
        required: false
        type: string
      integration_tests_branch:
        description: se-integration-tests branch (empty = selected E2E branch, then main fallback).
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Merge-triggered runs supersede one another. Scheduled nightlies remain
  # independent, so a nearby merge cannot cancel the nightly health check.
  group: e2e-playwright-${{ github.event_name == 'schedule' && 'nightly' || inputs.run_kind == 'merge' && 'merge' || inputs.run_kind == 'pr' && format('pr-{0}', inputs.source_sha) || 'manual' }}
  cancel-in-progress: ${{ inputs.run_kind == 'merge' }}

jobs:
  playwright-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out E2E workflow and notification script
        uses: actions/checkout@v4

      - name: Verify notification failure handling without sending mail
        run: python3 -m unittest discover -s .github/tests -v

      - name: Controlled failure notification exercise
        if: inputs.run_kind == 'notification-soak'
        run: |
          echo 'Controlled notification exercise: deliberately failing before private clones, browser tests or payments.'
          exit 1

      - name: Clone E2E repositories from Forgejo
        env:
          FORGEJO_E2E_TOKEN: ${{ secrets.FORGEJO_E2E_TOKEN }}
          E2E_WORKFLOW_BRANCH: ${{ github.ref_name }}
          RUN_KIND: ${{ inputs.run_kind }}
          FRONTEND_BRANCH_INPUT: ${{ inputs.frontend_branch }}
          BACKEND_BRANCH_INPUT: ${{ inputs.backend_branch }}
          INTEGRATION_TESTS_BRANCH_INPUT: ${{ inputs.integration_tests_branch }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: bash scripts/clone-e2e-repos.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: se-frontend/.nvmrc
          cache: npm
          cache-dependency-path: se-frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: se-backend/.python-version

      - name: Install frontend and backend dependencies
        run: |
          set -euo pipefail
          npm ci --prefix se-frontend --no-audit --no-fund
          python3 -m pip install --user -r se-backend/requirements.txt
          (
            cd se-backend
            poetry install --no-interaction
          )

      - name: Install Playwright Chromium
        working-directory: se-frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E smoke
        working-directory: se-frontend
        env:
          CI: true
          SE_E2E_STRIPE: "1"
          SE_E2E_GUEST_CHECKOUT: "0"
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          SE_E2E_BACKEND_PORT: "8021"
          SE_E2E_BACKEND_URL: http://127.0.0.1:8021
          VITE_API_BASE_URL: http://127.0.0.1:8021
          DEMO_SEED_PASSWORD: ${{ secrets.DEMO_SEED_PASSWORD }}
          MARKETPLACE_PLATFORM_FEE_BPS: "500"
          SE_BACKEND_DIR: ${{ github.workspace }}/se-backend
          SE_INTEGRATION_TESTS_DIR: ${{ github.workspace }}/se-integration-tests
          RUN_KIND: ${{ inputs.run_kind }}
        run: |
          if [[ "${RUN_KIND}" == "pr" ]]; then
            npm run test:e2e -- e2e/smoke/browse.spec.ts e2e/smoke/auth.spec.ts e2e/smoke/checkout.spec.ts
          else
            npm run test:e2e
          fi

      - name: Record merge trigger provenance
        if: inputs.run_kind == 'merge'
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          printf 'Merge-triggered by %s at %s\n' "$SOURCE_REPOSITORY" "$SOURCE_SHA"

      - name: Copy failure artifacts to May First
        if: failure()
        env:
          MAY_FIRST_AUTH_URL: ${{ secrets.MAY_FIRST_ARTIFACT_AUTH_URL }}
          MAY_FIRST_HOST: ${{ secrets.MAY_FIRST_ARTIFACT_HOST }}
          MAY_FIRST_USER: ${{ secrets.MAY_FIRST_ARTIFACT_USER }}
          MAY_FIRST_PASSWORD: ${{ secrets.MAY_FIRST_ARTIFACT_PASSWORD }}
          MAY_FIRST_ARTIFACT_DIR: ${{ secrets.MAY_FIRST_ARTIFACT_DIR }}
        run: |
          set -euo pipefail
          : "${MAY_FIRST_AUTH_URL:?MAY_FIRST_ARTIFACT_AUTH_URL secret is required}"
          : "${MAY_FIRST_HOST:?MAY_FIRST_ARTIFACT_HOST secret is required}"
          : "${MAY_FIRST_USER:?MAY_FIRST_ARTIFACT_USER secret is required}"
          : "${MAY_FIRST_PASSWORD:?MAY_FIRST_ARTIFACT_PASSWORD secret is required}"
          : "${MAY_FIRST_ARTIFACT_DIR:?MAY_FIRST_ARTIFACT_DIR secret is required}"

          artifacts=()
          [[ -d se-frontend/test-results ]] && artifacts+=(se-frontend/test-results)
          [[ -d se-frontend/e2e-report ]] && artifacts+=(se-frontend/e2e-report)
          if [[ "${#artifacts[@]}" -eq 0 ]]; then
            echo "No Playwright failure artifacts were produced."
          fi

          curl --fail --silent --show-error "$MAY_FIRST_AUTH_URL" \
            -X POST \
            --data-urlencode "user_name=$MAY_FIRST_USER" \
            --data-urlencode "user_pass=$MAY_FIRST_PASSWORD" \
            --data-urlencode 'action=grant'
          sudo apt-get update
          sudo apt-get install --yes sshpass

          export SSHPASS="$MAY_FIRST_PASSWORD"
          remote_run_dir="${MAY_FIRST_ARTIFACT_DIR%/}/${GITHUB_RUN_ID}"
          sshpass -e ssh -o StrictHostKeyChecking=no "$MAY_FIRST_USER@$MAY_FIRST_HOST" \
            "mkdir -p '$remote_run_dir'"
          if [[ "${#artifacts[@]}" -gt 0 ]]; then
            archive="e2e-playwright-${GITHUB_RUN_ID}.tar.gz"
            tar -czf "$archive" "${artifacts[@]}"
            sshpass -e scp -o StrictHostKeyChecking=no "$archive" \
              "$MAY_FIRST_USER@$MAY_FIRST_HOST:$remote_run_dir/$archive"
            echo "Failure artifacts copied to May First run directory ${GITHUB_RUN_ID}."
          fi

      - name: Send main nightly failure email through existing May First transport
        if: failure() && github.ref_name == 'main' && inputs.run_kind != 'pr' && (inputs.frontend_branch == '' || inputs.frontend_branch == 'main') && (inputs.backend_branch == '' || inputs.backend_branch == 'main') && (inputs.integration_tests_branch == '' || inputs.integration_tests_branch == 'main')
        env:
          MAY_FIRST_HOST: ${{ secrets.MAY_FIRST_ARTIFACT_HOST }}
          MAY_FIRST_USER: ${{ secrets.MAY_FIRST_ARTIFACT_USER }}
          MAY_FIRST_PASSWORD: ${{ secrets.MAY_FIRST_ARTIFACT_PASSWORD }}
          MAY_FIRST_ARTIFACT_DIR: ${{ secrets.MAY_FIRST_ARTIFACT_DIR }}
          NOTIFICATION_SOAK: ${{ inputs.run_kind == 'notification-soak' && '1' || '0' }}
        run: |
          set -euo pipefail
          : "${MAY_FIRST_HOST:?existing artifact host is required}"
          : "${MAY_FIRST_USER:?existing artifact user is required}"
          : "${MAY_FIRST_PASSWORD:?existing artifact credential is required}"
          : "${MAY_FIRST_ARTIFACT_DIR:?existing artifact directory is required}"
          [[ -f scripts/e2e-notify-failure.sh ]] || { echo '::error::Failure notification script is missing.'; exit 1; }
          export SSHPASS="$MAY_FIRST_PASSWORD"
          remote_run_dir="${MAY_FIRST_ARTIFACT_DIR%/}/${GITHUB_RUN_ID}"
          # The artifact step established this same host in known_hosts; do not disable checking here.
          sshpass -e ssh -o StrictHostKeyChecking=yes "$MAY_FIRST_USER@$MAY_FIRST_HOST" \
            "GITHUB_REF_NAME=main GITHUB_SERVER_URL=https://github.com GITHUB_REPOSITORY=cooperative-codebase/e2e GITHUB_RUN_ID=${GITHUB_RUN_ID} GITHUB_SHA=${GITHUB_SHA} ALERT_EMAIL=aaron@cooperativecodebase.com E2E_NOTIFICATION_SOAK=${NOTIFICATION_SOAK} SE_E2E_REPORT_DIR='$remote_run_dir' bash -s" \
            < scripts/e2e-notify-failure.sh

  record-run:
    needs: playwright-smoke
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: e2e-run-log
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - name: Check out run log
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Append run log and push
        env:
          RUN_RESULT: ${{ needs.playwright-smoke.result }}
          SMOKE_SCOPE: ${{ inputs.run_kind == 'pr' && 'pr-subset' || inputs.run_kind == 'notification-soak' && 'notification-soak' || 'full-smoke' }}
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          printf '%s\t%s\t%s\t%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$RUN_RESULT" "$SMOKE_SCOPE" "$GITHUB_RUN_ID" >> run-log.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add run-log.md
          git commit -m "chore: record E2E run"
          git push origin HEAD:main

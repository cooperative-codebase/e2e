name: E2E control checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  control-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check notification and source-selection failure paths without sending mail
        run: python3 -m unittest discover -s .github/tests -v
      - name: Check shell syntax
        run: bash -n scripts/clone-e2e-repos.sh scripts/e2e-notify-failure.sh

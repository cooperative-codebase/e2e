name: Renovate maintain (one repository)
description: Clone infrastructure from Forgejo and run one Renovate self-hosted config.

runs:
  using: composite
  steps:
    - name: Clone infrastructure from Forgejo
      shell: bash
      env:
        RENOVATE_TOKEN: ${{ env.RENOVATE_TOKEN }}
      run: |
        set -euo pipefail
        : "${RENOVATE_TOKEN:?RENOVATE_TOKEN secret is required}"
        git -c credential.helper= clone --depth 1 --branch main \
          "https://oauth2:${RENOVATE_TOKEN}@forgejo.cooperativecodebase.com/cooperative-codebase/infrastructure.git" \
          infrastructure

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "24.15"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13.5"

    - name: Install Poetry
      shell: bash
      run: pip install 'poetry==2.1.3'

    - name: Prepare pinned Renovate CLI
      shell: bash
      working-directory: infrastructure
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential
        VERSION="$(cat renovate/cli-version.txt)"
        CLI_PREFIX="${RUNNER_TEMP}/renovate-cli"
        rm -rf "${CLI_PREFIX}"
        NPM_CONFIG_IGNORE_SCRIPTS=false npm install --prefix "${CLI_PREFIX}" --no-package-lock \
          --include=optional "renovate@${VERSION}" "re2@1.27.0"
        REN_PKG="${CLI_PREFIX}/node_modules/renovate"
        node -e 'const {createRequire}=require("node:module");const {resolve}=require("node:path");const RE2=createRequire(resolve(process.argv[1],"package.json"))("re2");if(!new RE2("^ok$").test("ok"))throw new Error("Native RE2 verification failed")' "${REN_PKG}"
        printf 'RENOVATE_CLI=%s\n' "${CLI_PREFIX}/node_modules/.bin/renovate" >> "${GITHUB_ENV}"

    - name: Run Renovate
      shell: bash
      working-directory: infrastructure
      env:
        RENOVATE_TOKEN: ${{ env.RENOVATE_TOKEN }}
        RENOVATE_GITHUB_COM_TOKEN: ${{ env.RENOVATE_GITHUB_COM_TOKEN }}
        RENOVATE_REPO_LABEL: ${{ env.RENOVATE_REPO_LABEL }}
        UPDATE_MODE: ${{ env.UPDATE_MODE }}
      run: |
        set -euo pipefail
        : "${RENOVATE_TOKEN:?RENOVATE_TOKEN secret is required}"
        : "${RENOVATE_CLI:?Pinned CLI bootstrap must succeed}"
        : "${RENOVATE_REPO_LABEL:?RENOVATE_REPO_LABEL is required}"
        export npm_config_ignore_scripts=true
        log="${RUNNER_TEMP}/renovate.log"
        set +e
        case "${UPDATE_MODE}" in
          preview) "${RENOVATE_CLI}" --dry-run=full >>"${log}" 2>&1 ;;
          updates) "${RENOVATE_CLI}" >>"${log}" 2>&1 ;;
          *) echo "Unknown UPDATE_MODE" >&2; exit 1 ;;
        esac
        code=$?
        set -e
        echo "Renovate maintain-${RENOVATE_REPO_LABEL} finished (mode=${UPDATE_MODE}, exit=${code})"
        exit "${code}"